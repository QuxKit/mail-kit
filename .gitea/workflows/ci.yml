# CI — lint, typecheck, build and the full test suite on every push and PR.
#
# Host runner (brett-local): node (nvm), pnpm and PostgreSQL are already there,
# so the DB-backed tests run for real — REQUIRE_DB makes an unreachable
# database a failure rather than a skip. No external actions; the checkout is a
# plain git clone with the job token. Paths are derived, never hardcoded.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: host
    steps:
      - name: Put node / pnpm / psql on PATH
        run: |
          ls -d "$HOME"/.nvm/versions/node/*/bin | tail -1 >> "$GITHUB_PATH"
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Checkout
        run: |
          rm -rf src-checkout
          git clone "http://token:${{ github.token }}@localhost:3003/${{ github.repository }}.git" src-checkout
          cd src-checkout && git checkout "${{ github.sha }}"

      - name: Ensure the test database exists
        run: createdb mail_kit_test 2>/dev/null || true

      - name: Lint, typecheck, build, test
        working-directory: src-checkout
        env:
          REQUIRE_DB: 1
          MAIL_KIT_TEST_DATABASE_URL: postgres://localhost:5432/mail_kit_test
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm check:harness
          pnpm test:coverage
